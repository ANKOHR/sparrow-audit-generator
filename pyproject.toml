[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparrow-audit-generator"
version = "0.1.0"
description = "Operational audits computed solely from supplied observations"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sag = "sag.cli:main"

[tool.setuptools.packages.find]
include = ["sag*"]
